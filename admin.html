<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administrador | B4X</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      padding: 25px;
    }

    .contenedor {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #999;
      margin-bottom: 25px;
    }

    .panel {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    h3 {
      margin-bottom: 10px;
    }

    .descripcion-panel {
      color: #999;
      margin-bottom: 20px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      color: #ccc;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0b0b;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    .boton-eliminar {
      background: #b00020;
      color: white;
      margin-top: 10px;
    }

    .mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 20px;
    }

    .lista {
      margin-top: 25px;
    }

    .elemento {
      background: #0d0d0d;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .elemento-contenido {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .mini-imagen {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 10px;
      background: #222;
      border: 1px solid #333;
      flex-shrink: 0;
    }

    .sin-imagen {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #222;
      color: #777;
      font-size: 11px;
      text-align: center;
      flex-shrink: 0;
    }

    .elemento-info {
      flex: 1;
    }

    .elemento-info h3 {
      font-size: 17px;
      margin-bottom: 4px;
    }

    .elemento-info p {
      color: #999;
      font-size: 13px;
    }

    .volver {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      text-decoration: none;
    }

    .volver:hover {
      color: white;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .panel {
        padding: 18px;
      }

      .elemento-contenido {
        align-items: flex-start;
      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <h1>
    Panel de Administración B4X
  </h1>

  <p class="subtitulo">
    Administra los productos y categorías de tu tienda.
  </p>


  <!-- =========================
       CATEGORÍAS
  ========================== -->

  <div class="panel">

    <h2>
      📂 Categorías
    </h2>

    <p class="descripcion-panel">
      Crea categorías con emoji e imagen.
    </p>


    <label>
      Nombre de la categoría
    </label>

    <input
      id="nuevaCategoria"
      type="text"
      placeholder="Ej: Gomitas"
    >


    <label>
      Emoji de la categoría
    </label>

    <input
      id="emojiCategoria"
      type="text"
      placeholder="Ej: 🍬"
      maxlength="10"
    >


    <label>
      Imagen de la categoría
    </label>

    <input
      id="imagenCategoria"
      type="file"
      accept="image/*"
    >


    <button
      type="button"
      onclick="agregarCategoria()"
    >
      ➕ Agregar categoría
    </button>


    <div
      id="mensajeCategoria"
      class="mensaje"
    ></div>


    <div class="lista">

      <h3>
        Categorías existentes
      </h3>

      <div
        id="listaCategorias"
      ></div>

    </div>

  </div>


  <!-- =========================
       PRODUCTOS
  ========================== -->

  <div class="panel">

    <h2>
      🛍️ Productos
    </h2>

    <p class="descripcion-panel">
      Agrega productos y asígnalos a una categoría.
    </p>


    <label>
      Nombre del producto
    </label>

    <input
      id="nombre"
      type="text"
      placeholder="Ej: Gomitas B4X"
    >


    <label>
      Descripción
    </label>

    <textarea
      id="descripcion"
      placeholder="Descripción del producto"
    ></textarea>


    <label>
      Precio
    </label>

    <input
      id="precio"
      type="number"
      placeholder="2000"
      min="0"
    >


    <label>
      Categoría
    </label>

    <select id="categoria">

      <option value="">
        Cargando categorías...
      </option>

    </select>


    <label>
      Imagen del producto
    </label>

    <input
      id="imagen"
      type="file"
      accept="image/*"
    >


    <button
      type="button"
      onclick="guardarProducto()"
    >
      ➕ Guardar producto
    </button>


    <div
      id="mensaje"
      class="mensaje"
    ></div>


    <div class="lista">

      <h3>
        Productos existentes
      </h3>

      <div
        id="listaProductos"
      ></div>

    </div>

  </div>


  <a
    class="volver"
    href="index.html"
  >
    ← Volver a la tienda
  </a>


</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ltdqlcthnfbkvpsnfgcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NF-03kT-227KX7a4TalkXw_0ude6870";


/* =========================
   CATEGORÍAS
========================= */

async function cargarCategorias() {

  const select =
    document.getElementById(
      "categoria"
    );

  try {

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/CATEGOR%C3%8DAS" +
        "?select=IDENTIFICACI%C3%93N,Nombre,Emoji,Imagen" +
        "&order=IDENTIFICACI%C3%93N.asc",

        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }

      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    const categorias =
      await respuesta.json();


    select.innerHTML =
      '<option value="">Selecciona una categoría</option>';


    categorias.forEach(
      categoria => {

        const opcion =
          document.createElement(
            "option"
          );

        opcion.value =
          categoria.Nombre;

        opcion.textContent =
          (categoria.Emoji || "📦") +
          " " +
          categoria.Nombre;

        select.appendChild(
          opcion
        );

      }
    );


    mostrarCategorias(
      categorias
    );

  }

  catch (error) {

    console.error(error);

    select.innerHTML =
      '<option value="">Error al cargar categorías</option>';

  }

}


/* =========================
   MOSTRAR CATEGORÍAS
========================= */

function mostrarCategorias(
  categorias
) {

  const contenedor =
    document.getElementById(
      "listaCategorias"
    );

  contenedor.innerHTML = "";


  if (
    !categorias ||
    categorias.length === 0
  ) {

    contenedor.innerHTML =
      "<p style='color:#777;margin-top:10px'>" +
      "No hay categorías." +
      "</p>";

    return;

  }


  categorias.forEach(
    categoria => {

      const elemento =
        document.createElement(
          "div"
        );

      elemento.className =
        "elemento";


      const imagen =
        categoria.Imagen &&
        String(categoria.Imagen).trim();


      elemento.innerHTML = `

        <div class="elemento-contenido">

          ${
            imagen

            ? `

              <img
                class="mini-imagen"
                src="${imagen}"
                alt="${categoria.Nombre}"
              >

            `

            : `

              <div class="sin-imagen">
                ${categoria.Emoji || "📦"}
              </div>

            `
          }


          <div class="elemento-info">

            <h3>
              ${categoria.Emoji || "📦"}
              ${categoria.Nombre}
            </h3>

            <p>
              IDENTIFICACIÓN:
              ${categoria.IDENTIFICACIÓN}
            </p>

          </div>

        </div>


        <button
          type="button"
          class="boton-eliminar"
          onclick="eliminarCategoria(
            '${String(categoria.IDENTIFICACIÓN).replace(/'/g, "\\'")}',
            '${String(categoria.Nombre).replace(/'/g, "\\'")}'
          )"
        >
          🗑️ Eliminar categoría
        </button>

      `;


      contenedor.appendChild(
        elemento
      );

    }
  );

}


/* =========================
   AGREGAR CATEGORÍA
========================= */

async function agregarCategoria() {

  const nombreInput =
    document.getElementById(
      "nuevaCategoria"
    );

  const emojiInput =
    document.getElementById(
      "emojiCategoria"
    );

  const imagenInput =
    document.getElementById(
      "imagenCategoria"
    );

  const mensaje =
    document.getElementById(
      "mensajeCategoria"
    );


  const nombre =
    nombreInput.value.trim();

  const emoji =
    emojiInput.value.trim();

  const archivo =
    imagenInput.files[0];


  if (!nombre) {

    mensaje.textContent =
      "⚠️ Escribe el nombre de la categoría.";

    return;

  }


  if (!emoji) {

    mensaje.textContent =
      "⚠️ Escribe un emoji.";

    return;

  }


  mensaje.textContent =
    "Creando categoría...";


  try {

    let imagenURL = null;


    /* SUBIR IMAGEN */

    if (archivo) {

      const nombreArchivo =
        Date.now() +
        "_" +
        archivo.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const ruta =
        "categorias/" +
        nombreArchivo;


      const subida =
        await fetch(

          SUPABASE_URL +
          "/storage/v1/object/productos/" +
          ruta,

          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY,
              "Content-Type":
                archivo.type
            },

            body: archivo
          }

        );


      if (!subida.ok) {

        throw new Error(
          "No se pudo subir la imagen: " +
          await subida.text()
        );

      }


      imagenURL =
        SUPABASE_URL +
        "/storage/v1/object/public/productos/" +
        ruta;

    }


    /* GUARDAR */

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/CATEGOR%C3%8DAS",

        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({

            Nombre:
              nombre,

            Emoji:
              emoji,

            Imagen:
              imagenURL

          })

        }

      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    mensaje.textContent =
      "✅ Categoría agregada correctamente.";


    nombreInput.value = "";

    emojiInput.value = "";

    imagenInput.value = "";


    await cargarCategorias();

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =========================
   ELIMINAR CATEGORÍA
========================= */

async function eliminarCategoria(
  identificacion,
  nombre
) {

  if (
    !confirm(
      "¿Seguro que quieres eliminar la categoría " +
      nombre +
      "?"
    )
  ) {

    return;

  }


  const mensaje =
    document.getElementById(
      "mensajeCategoria"
    );


  mensaje.textContent =
    "Comprobando productos...";


  try {

    /* COMPROBAR PRODUCTOS */

    const productosRespuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/PRODUCTOS" +
        "?select=ID,Nombre,Categoria" +
        "&Categoria=eq." +
        encodeURIComponent(nombre),

        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }

      );


    if (!productosRespuesta.ok) {

      throw new Error(
        await productosRespuesta.text()
      );

    }


    const productos =
      await productosRespuesta.json();


    if (productos.length > 0) {

      mensaje.textContent =
        "⚠️ No se puede eliminar porque " +
        "esta categoría tiene " +
        productos.length +
        " producto(s).";

      return;

    }


    /* ELIMINAR */

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/CATEGOR%C3%8DAS" +
        "?IDENTIFICACI%C3%93N=eq." +
        encodeURIComponent(
          identificacion
        ),

        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }

      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    mensaje.textContent =
      "✅ Categoría eliminada correctamente.";


    await cargarCategorias();

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error al eliminar: " +
      error.message;

  }

}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function guardarProducto() {

  const nombre =
    document.getElementById(
      "nombre"
    ).value.trim();

  const descripcion =
    document.getElementById(
      "descripcion"
    ).value.trim();

  const precio =
    document.getElementById(
      "precio"
    ).value;

  const categoria =
    document.getElementById(
      "categoria"
    ).value;

  const archivo =
    document.getElementById(
      "imagen"
    ).files[0];

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  if (
    !nombre ||
    !precio ||
    !categoria
  ) {

    mensaje.textContent =
      "⚠️ Completa nombre, precio y categoría.";

    return;

  }


  if (!archivo) {

    mensaje.textContent =
      "⚠️ Selecciona una imagen.";

    return;

  }


  mensaje.textContent =
    "Guardando producto...";


  try {

    const nombreArchivo =
      Date.now() +
      "_" +
      archivo.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const ruta =
      "imagenes/" +
      nombreArchivo;


    /* SUBIR IMAGEN */

    const subida =
      await fetch(

        SUPABASE_URL +
        "/storage/v1/object/productos/" +
        ruta,

        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              archivo.type
          },

          body: archivo
        }

      );


    if (!subida.ok) {

      throw new Error(
        "No se pudo subir la imagen: " +
        await subida.text()
      );

    }


    const imagen =
      SUPABASE_URL +
      "/storage/v1/object/public/productos/" +
      ruta;


    /* GUARDAR PRODUCTO */

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/PRODUCTOS",

        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({

            Nombre:
              nombre,

            Descripcion:
              descripcion,

            Precio:
              Number(precio),

            Categoria:
              categoria,

            Imagen:
              imagen

          })

        }

      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    mensaje.textContent =
      "✅ Producto guardado correctamente.";


    document.getElementById(
      "nombre"
    ).value = "";

    document.getElementById(
      "descripcion"
    ).value = "";

    document.getElementById(
      "precio"
    ).value = "";

    document.getElementById(
      "imagen"
    ).value = "";


    await cargarProductos();

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =========================
   CARGAR PRODUCTOS
========================= */

async function cargarProductos() {

  const contenedor =
    document.getElementById(
      "listaProductos"
    );


  try {

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/PRODUCTOS" +
        "?select=ID,Nombre,Descripcion,Precio,Categoria,Imagen" +
        "&order=ID.asc",

        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }

      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    const productos =
      await respuesta.json();


    mostrarProductos(
      productos
    );

  }

  catch (error) {

    console.error(error);

    contenedor.innerHTML =
      "<p style='color:#777;margin-top:10px'>" +
      "No se pudieron cargar los productos." +
      "</p>";

  }

}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(
  productos
) {

  const contenedor =
    document.getElementById(
      "listaProductos"
    );

  contenedor.innerHTML = "";


  if (
    !productos ||
    productos.length === 0
  ) {

    contenedor.innerHTML =
      "<p style='color:#777;margin-top:10px'>" +
      "No hay productos." +
      "</p>";

    return;

  }


  productos.forEach(
    producto => {

      const elemento =
        document.createElement(
          "div"
        );

      elemento.className =
        "elemento";


      const imagen =
        producto.Imagen &&
        String(producto.Imagen).trim();


      elemento.innerHTML = `

        <div class="elemento-contenido">

          ${
            imagen

            ? `

              <img
                class="mini-imagen"
                src="${imagen}"
                alt="${producto.Nombre}"
              >

            `

            : `

              <div class="sin-imagen">
                Sin imagen
              </div>

            `
          }


          <div class="elemento-info">

            <h3>
              ${producto.Nombre}
            </h3>

            <p>
              Categoría:
              ${producto.Categoria || "Sin categoría"}
            </p>

            <p>
              Precio:
              $${Number(
                producto.Precio
              ).toLocaleString("es-CO")}
            </p>

            <p>
              ID:
              ${producto.ID}
            </p>

          </div>

        </div>


        <button
          type="button"
          class="boton-eliminar"
          onclick="eliminarProducto(
            '${String(producto.ID).replace(/'/g, "\\'")}',
            '${String(producto.Nombre).replace(/'/g, "\\'")}'
          )"
        >
          🗑️ Eliminar producto
        </button>

      `;


      contenedor.appendChild(
        elemento
      );

    }
  );

}


/* =========================
   ELIMINAR PRODUCTO
========================= */

async function eliminarProducto(
  id,
  nombre
) {

  if (
    !confirm(
      "¿Seguro que quieres eliminar el producto " +
      nombre +
      "?"
    )
  ) {

    return;

  }


  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.textContent =
    "Eliminando producto...";


  try {

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/PRODUCTOS" +
        "?ID=eq." +
        encodeURIComponent(id),

        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }

        }

      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    mensaje.textContent =
      "✅ Producto eliminado correctamente.";


    await cargarProductos();

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error al eliminar: " +
      error.message;

  }

}


/* =========================
   INICIAR
========================= */

cargarCategorias();

cargarProductos();

</script>


</body>

</html>
