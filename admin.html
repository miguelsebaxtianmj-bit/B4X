<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administrador | B4X</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      padding: 25px;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #999;
      margin-bottom: 25px;
    }

    .panel {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 25px;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      color: #ccc;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0b0b;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #mensaje {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .volver {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>Panel de Administración B4X</h1>

  <p class="subtitulo">
    Agrega productos a tu tienda.
  </p>

  <div class="panel">

    <label>Nombre del producto</label>
    <input id="nombre" type="text" placeholder="Ej: Gomitas B4X">

    <label>Descripción</label>
    <textarea id="descripcion"
      placeholder="Descripción del producto"></textarea>

    <label>Precio</label>
    <input id="precio" type="number" placeholder="2000">

    <label>Categoría</label>
    <select id="categoria">
      <option value="Gomitas">Gomitas</option>
      <option value="Gomitas Picantes">Gomitas Picantes</option>
      <option value="Combos">Combos</option>
      <option value="Especiales">Especiales</option>
    </select>

    <label>Imagen</label>
    <input id="imagen" type="file" accept="image/*">

    <button type="button" onclick="guardarProducto()">
      Guardar producto
    </button>

    <div id="mensaje"></div>

  </div>

  <a class="volver" href="index.html">
    ← Volver a la tienda
  </a>

</div>

<script>

const SUPABASE_URL =
"https://ltdqlcthnfbkvpsnfgcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NF-03kT-227KX7a4TalkXw_0ude6870";


async function guardarProducto() {

  const nombre =
    document.getElementById("nombre").value.trim();

  const descripcion =
    document.getElementById("descripcion").value.trim();

  const precio =
    document.getElementById("precio").value;

  const categoria =
    document.getElementById("categoria").value;

  const imagen =
    document.getElementById("imagen").value.trim();

  const mensaje =
    document.getElementById("mensaje");


  if (!nombre || !precio) {

    mensaje.textContent =
      "⚠️ Completa el nombre y el precio.";

    return;
  }


  mensaje.textContent =
    "Guardando producto...";


  try {

    const respuesta = await fetch(
      SUPABASE_URL + "/rest/v1/PRODUCTOS",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({

          Nombre: nombre,

          Descripcion: descripcion,

          Precio: Number(precio),

          Categoria: categoria,

          Imagen: imagen

        })
      }
    );


    if (!respuesta.ok) {

      const error =
        await respuesta.text();

      throw new Error(error);
    }


    mensaje.textContent =
      "✅ Producto guardado correctamente.";

    document.getElementById("nombre").value = "";
    document.getElementById("descripcion").value = "";
    document.getElementById("precio").value = "";
    document.getElementById("imagen").value = "";

  }


  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " + error.message;

  }

}

</script>

</body>
</html>
