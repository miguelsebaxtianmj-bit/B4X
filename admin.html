async function agregarCategoria() {

  const nombre =
    document.getElementById(
      "nuevaCategoria"
    ).value.trim();


  const emoji =
    document.getElementById(
      "emojiCategoria"
    ).value.trim();


  const archivo =
    document.getElementById(
      "imagenCategoria"
    ).files[0];


  const mensaje =
    document.getElementById(
      "mensajeCategoria"
    );


  if (!nombre) {

    mensaje.textContent =
      "⚠️ Escribe el nombre de la categoría.";

    return;

  }


  if (!emoji) {

    mensaje.textContent =
      "⚠️ Escribe un emoji.";

    return;

  }


  mensaje.textContent =
    "Creando categoría...";


  try {

    let imagenURL = null;


    if (archivo) {

      const nombreArchivo =
        Date.now() +
        "_" +
        archivo.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const ruta =
        "categorias/" +
        nombreArchivo;


      const subida =
        await fetch(
          SUPABASE_URL +
          "/storage/v1/object/productos/" +
          ruta,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY,
              "Content-Type":
                archivo.type
            },

            body: archivo
          }
        );


      if (!subida.ok) {

        throw new Error(
          await subida.text()
        );

      }


      imagenURL =
        SUPABASE_URL +
        "/storage/v1/object/public/productos/" +
        ruta;

    }


    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/CATEGOR%C3%8DAS",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({
            Nombre: nombre,
            Emoji: emoji,
            Imagen: imagenURL
          })
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    mensaje.textContent =
      "✅ Categoría agregada correctamente.";


    document.getElementById(
      "nuevaCategoria"
    ).value = "";


    document.getElementById(
      "emojiCategoria"
    ).value = "";


    document.getElementById(
      "imagenCategoria"
    ).value = "";


    await cargarCategorias();

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

  }

}

async function eliminarCategoria(
  identificacion,
  nombre
) {

  if (
    !confirm(
      "¿Seguro que quieres eliminar la categoría " +
      nombre +
      "?"
    )
  ) {

    return;

  }


  const mensaje =
    document.getElementById(
      "mensajeCategoria"
    );


  try {

    mensaje.textContent =
      "Comprobando productos...";


    const productosRespuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/PRODUCTOS" +
        "?select=ID,Nombre,Categoria" +
        "&Categoria=eq." +
        encodeURIComponent(nombre),
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if (!productosRespuesta.ok) {

      throw new Error(
        await productosRespuesta.text()
      );

    }


    const productos =
      await productosRespuesta.json();


    if (productos.length > 0) {

      mensaje.textContent =
        "⚠️ No se puede eliminar porque " +
        "esta categoría tiene " +
        productos.length +
        " producto(s).";

      return;

    }


    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/CATEGOR%C3%8DAS" +
        "?IDENTIFICACI%C3%93N=eq." +
        encodeURIComponent(
          identificacion
        ),
        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    mensaje.textContent =
      "✅ Categoría eliminada correctamente.";


    await cargarCategorias();

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error al eliminar: " +
      error.message;

  }

}

async function editarProducto(
  id
) {

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  try {

    mensaje.textContent =
      "Cargando producto...";


    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/PRODUCTOS" +
        "?select=ID,Nombre,Descripcion,Precio,Categoria,Imagen" +
        "&ID=eq." +
        encodeURIComponent(id),
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    const productos =
      await respuesta.json();


    if (!productos.length) {

      throw new Error(
        "No se encontró el producto."
      );

    }


    const producto =
      productos[0];


    productoEditandoID =
      producto.ID;


    document.getElementById(
      "nombre"
    ).value =
      producto.Nombre || "";


    document.getElementById(
      "descripcion"
    ).value =
      producto.Descripcion || "";


    document.getElementById(
      "precio"
    ).value =
      producto.Precio || "";


    document.getElementById(
      "categoria"
    ).value =
      producto.Categoria || "";


    document.getElementById(
      "imagen"
    ).value = "";


    document.getElementById(
      "botonGuardarProducto"
    ).textContent =
      "💾 Actualizar producto";


    document.getElementById(
      "botonCancelarEdicion"
    ).style.display =
      "block";


    mensaje.textContent =
      "✏️ Editando: " +
      producto.Nombre;


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

  }

}

/* =========================
   ACTUALIZAR PRODUCTO
========================= */

async function actualizarProducto() {

  const nombre =
    document.getElementById(
      "nombre"
    ).value.trim();


  const descripcion =
    document.getElementById(
      "descripcion"
    ).value.trim();


  const precio =
    document.getElementById(
      "precio"
    ).value;


  const categoria =
    document.getElementById(
      "categoria"
    ).value;


  const archivo =
    document.getElementById(
      "imagen"
    ).files[0];


  const mensaje =
    document.getElementById(
      "mensaje"
    );


  if (
    !nombre ||
    !precio ||
    !categoria
  ) {

    mensaje.textContent =
      "⚠️ Completa nombre, precio y categoría.";

    return;

  }


  mensaje.textContent =
    "Actualizando producto...";


  try {

    const datos = {

      Nombre:
        nombre,

      Descripcion:
        descripcion,

      Precio:
        Number(precio),

      Categoria:
        categoria

    };


    /* =========================
       NUEVA IMAGEN OPCIONAL
    ========================= */

    if (archivo) {

      const nombreArchivo =
        Date.now() +
        "_" +
        archivo.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const ruta =
        "imagenes/" +
        nombreArchivo;


      const subida =
        await fetch(
          SUPABASE_URL +
          "/storage/v1/object/productos/" +
          ruta,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY,
              "Content-Type":
                archivo.type
            },

            body: archivo
          }
        );


      if (!subida.ok) {

        throw new Error(
          await subida.text()
        );

      }


      datos.Imagen =
        SUPABASE_URL +
        "/storage/v1/object/public/productos/" +
        ruta;

    }


    /* =========================
       ACTUALIZAR SUPABASE
    ========================= */

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/PRODUCTOS" +
        "?ID=eq." +
        encodeURIComponent(
          productoEditandoID
        ),
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(
              datos
            )
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        await respuesta.text()
      );

    }


    mensaje.textContent =
      "✅ Producto actualizado correctamente.";


    cancelarEdicion();


    await cargarProductos();

  }

  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

  }

}
