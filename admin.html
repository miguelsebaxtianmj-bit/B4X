```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administrador | B4X</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      padding: 25px;
    }

    .contenedor {
      max-width: 700px;

    }

    h1 {
      margin-bottom: 8px;

    .subtitulo {
      color: #999;
      margin-bottom: 25px;
    }

    .panel {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;

    h2 {
      margin-bottom: 8px;

    .descripcion-panel {
      color: #999;
      margin-bottom: 20px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 7px;

    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #333;

      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #mensajeCategoria,
    #mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .volver {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>Panel de Administración B4X</h1>

  <p class="subtitulo">
    Administra los productos y categorías de tu tienda.
  </p>


  <!-- =========================
       CATEGORÍAS
  ========================== -->

  <div class="panel">

    <h2>📂 Agregar categoría</h2>

    <p class="descripcion-panel">
      Crea una nueva categoría para tus productos.
    </p>

    <label>
      Nombre de la categoría
    </label>

    <input
      id="nuevaCategoria"
      type="text"
      placeholder="Ej: Gomitas">

    <label>
      Emoji de la categoría
    </label>

    <input
      id="emojiCategoria"
      type="text"
      placeholder="Ej: 🌶️"
      maxlength="10">

    <button
      type="button"
      onclick="agregarCategoria()">

      ➕ Agregar categoría

    </button>

    <div id="mensajeCategoria"></div>

  </div>


  <!-- =========================
       PRODUCTOS
  ========================== -->

  <div class="panel">

    <h2>🛍️ Agregar producto</h2>

    <p class="descripcion-panel">
      Agrega un nuevo producto a tu tienda.
    </p>

    <label>
      Nombre del producto
    </label>

    <input
      id="nombre"
      type="text"
      placeholder="Ej: Gomitas B4X">

    <label>
      Descripción
    </label>

    <textarea
      id="descripcion"
      placeholder="Descripción del producto"></textarea>

    <label>
      Precio
    </label>

    <input
      id="precio"
      type="number"
      placeholder="2000">

    <label>
      Categoría
    </label>

    <select id="categoria">

      <option value="">
        Cargando categorías...
      </option>

    </select>

    <label>
      Imagen
    </label>

    <input
      id="imagen"
      type="file"
      accept="image/*">

    <button
      type="button"
      onclick="guardarProducto()">

      Guardar producto

    </button>

    <div id="mensaje"></div>

  </div>


  <a class="volver" href="index.html">
    ← Volver a la tienda
  </a>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ltdqlcthnfbkvpsnfgcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NF-03kT-227KX7a4TalkXw_0ude6870";


/* =========================
   CARGAR CATEGORÍAS
========================= */

async function cargarCategorias() {

  const select =
    document.getElementById("categoria");

  try {

    const respuesta = await fetch(

      SUPABASE_URL +
      "/rest/v1/CATEGOR%C3%8DAS?select=*&order=id.asc",

      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }

    );

    if (!respuesta.ok) {
      throw new Error(await respuesta.text());
    }

    const categorias =
      await respuesta.json();

    select.innerHTML =
      '<option value="">Selecciona una categoría</option>';


    categorias.forEach(categoria => {

      const opcion =
        document.createElement("option");


      opcion.value =
        categoria.Nombre;


      opcion.textContent =
        (categoria["IDENTIFICACIÓN"] || "📦") +
        " " +
        categoria.Nombre;


      select.appendChild(opcion);

    });

  }

  catch (error) {

    console.error(error);

    select.innerHTML =
      '<option value="">Error al cargar categorías</option>';

  }

}


/* =========================
   AGREGAR CATEGORÍA
========================= */

async function agregarCategoria() {

  const input =
    document.getElementById("nuevaCategoria");

  const inputEmoji =
    document.getElementById("emojiCategoria");

  const mensaje =
    document.getElementById("mensajeCategoria");


  const nombre =
    input.value.trim();

  const emoji =
    inputEmoji.value.trim();


  if (!nombre) {

    mensaje.textContent =
      "⚠️ Escribe el nombre de la categoría.";

    return;

  }


  if (!emoji) {

    mensaje.textContent =
      "⚠️ Escribe un emoji para la categoría.";

    return;

  }


  mensaje.textContent =
    "Creando categoría...";


  try {

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/CATEGOR%C3%8DAS",

        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({

            Nombre: nombre,

            "IDENTIFICACIÓN": emoji

          })

        }

      );


    if (!respuesta.ok) {

      const error =
        await respuesta.text();

      throw new Error(error);

    }


    mensaje.textContent =
      "✅ Categoría agregada correctamente.";


    input.value = "";

    inputEmoji.value = "";


    await cargarCategorias();

  }


  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function guardarProducto() {

  const nombre =
    document
      .getElementById("nombre")
      .value
      .trim();


  const descripcion =
    document
      .getElementById("descripcion")
      .value
      .trim();


  const precio =
    document
      .getElementById("precio")
      .value;


  const categoria =
    document
      .getElementById("categoria")
      .value;


  const archivoImagen =
    document
      .getElementById("imagen")
      .files[0];


  const mensaje =
    document.getElementById("mensaje");


  if (!nombre || !precio || !categoria) {

    mensaje.textContent =
      "⚠️ Completa nombre, precio y categoría.";

    return;

  }


  if (!archivoImagen) {

    mensaje.textContent =
      "⚠️ Selecciona una imagen.";

    return;

  }


  mensaje.textContent =
    "Guardando producto...";


  try {

    /* =========================
       SUBIR IMAGEN
    ========================= */

    const nombreArchivo =
      Date.now() +
      "_" +
      archivoImagen.name;


    const rutaImagen =
      "imagenes/" +
      nombreArchivo;


    const subida =
      await fetch(

        SUPABASE_URL +
        "/storage/v1/object/productos/" +
        rutaImagen,

        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": archivoImagen.type
          },

          body: archivoImagen

        }

      );


    if (!subida.ok) {

      const error =
        await subida.text();

      throw new Error(
        "No se pudo subir la imagen: " +
        error
      );

    }


    /* =========================
       URL IMAGEN
    ========================= */

    const imagen =
      SUPABASE_URL +
      "/storage/v1/object/public/productos/" +
      rutaImagen;


    /* =========================
       GUARDAR PRODUCTO
    ========================= */

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/PRODUCTOS",

        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({

            Nombre: nombre,

            Descripcion: descripcion,

            Precio: Number(precio),

            Categoria: categoria,

            Imagen: imagen

          })

        }

      );


    if (!respuesta.ok) {

      const error =
        await respuesta.text();

      throw new Error(error);

    }


    mensaje.textContent =
      "✅ Producto guardado correctamente.";


    document.getElementById("nombre").value = "";

    document.getElementById("descripcion").value = "";

    document.getElementById("precio").value = "";

    document.getElementById("imagen").value = "";

  }


  catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =========================
   INICIAR
========================= */

cargarCategorias();

</script>

</body>
</html>
